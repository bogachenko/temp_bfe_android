name: Patch My Files sheet visual contract

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-my-files-sheet-visual.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable

      - name: Apply source-proven OneDrive sheet visuals
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/static const double myFilesBottomSheet = 16;/static const double myFilesBottomSheet = 24;/' lib/theme/app_radius.dart
          python3 -c "from pathlib import Path; p=Path('lib/features/my_files/presentation/my_files_screen.dart'); s=p.read_text(); old='      backgroundColor: AppColors.neutralBackground1,\\n      shape: const RoundedRectangleBorder('; new='      backgroundColor: AppColors.neutralBackground2,\\n      barrierColor: AppColors.dialogScrim,\\n      elevation: 7,\\n      shape: const RoundedRectangleBorder('; assert old in s; p.write_text(s.replace(old,new,1))"
          grep -q 'myFilesBottomSheet = 24;' lib/theme/app_radius.dart
          grep -q 'backgroundColor: AppColors.neutralBackground2' lib/features/my_files/presentation/my_files_screen.dart
          grep -q 'barrierColor: AppColors.dialogScrim' lib/features/my_files/presentation/my_files_screen.dart

      - name: Validate
        run: |
          flutter pub get
          dart format lib/theme/app_radius.dart lib/features/my_files/presentation/my_files_screen.dart
          flutter test test/my_files_screen_test.dart
          flutter test
          flutter analyze
          flutter build apk --debug
          git checkout -- pubspec.lock

      - name: Commit validated visual patch
        run: |
          rm .github/workflows/patch-my-files-sheet-visual.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Match My Files sheet surface to OneDrive OD3"
          git push
