name: Restore My Files Details action

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-my-files-details.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable

      - name: Restore Details navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/features/my_files/presentation/my_files_screen.dart')
          s = p.read_text()

          replacements = {
            "_SheetAction(Icons.edit_outlined, l10n.rename)": "_SheetAction(Icons.edit_outlined, l10n.rename, action: DriveItemAction.rename)",
            "_SheetAction(Icons.copy_outlined, l10n.copyCommand)": "_SheetAction(Icons.copy_outlined, l10n.copyCommand, action: DriveItemAction.copy)",
            "_SheetAction(Icons.drive_file_move_outline, l10n.moveCommand)": "_SheetAction(Icons.drive_file_move_outline, l10n.moveCommand, action: DriveItemAction.move)",
            "_SheetAction(Icons.comment_outlined, l10n.comments)": "_SheetAction(Icons.comment_outlined, l10n.comments, action: DriveItemAction.comments)",
            "_SheetAction(Icons.info_outline, l10n.details)": "_SheetAction(Icons.info_outline, l10n.details, action: DriveItemAction.details)",
          }
          for old, new in replacements.items():
            if old not in s:
              raise RuntimeError(f'missing expected constructor: {old}')
            s = s.replace(old, new, 1)

          old_tap = """  Widget _buildBottomAction(_SheetAction action) {\n    return InkWell(\n      onTap: () => Navigator.of(context).pop(),"""
          new_tap = """  Widget _buildBottomAction(_SheetAction action) {\n    return InkWell(\n      onTap: () async {\n        final navigator = Navigator.of(context);\n        navigator.pop();\n        if (action.action == DriveItemAction.details) {\n          await navigator.push(\n            MaterialPageRoute<void>(\n              builder: (_) => _MyFilesDetailsScreen(\n                item: widget.item,\n                title: widget.title,\n                metadata: widget.metadata,\n              ),\n            ),\n          );\n        }\n      },"""
          if old_tap not in s:
            raise RuntimeError('missing _buildBottomAction tap block')
          s = s.replace(old_tap, new_tap, 1)

          old_action = """class _SheetAction {\n  const _SheetAction(this.icon, this.label);\n\n  final IconData icon;\n  final String label;\n}"""
          new_action = """class _SheetAction {\n  const _SheetAction(this.icon, this.label, {this.action});\n\n  final IconData icon;\n  final String label;\n  final DriveItemAction? action;\n}\n\nclass _MyFilesDetailsScreen extends StatelessWidget {\n  const _MyFilesDetailsScreen({\n    required this.item,\n    required this.title,\n    required this.metadata,\n  });\n\n  final DriveItem item;\n  final String title;\n  final String metadata;\n\n  @override\n  Widget build(BuildContext context) {\n    final l10n = AppLocalizations.of(context);\n\n    return Scaffold(\n      key: const Key('myFilesDetailsScreen'),\n      appBar: AppBar(title: Text(l10n.details)),\n      body: SingleChildScrollView(\n        child: Padding(\n          padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 32),\n          child: Column(\n            crossAxisAlignment: CrossAxisAlignment.stretch,\n            children: [\n              Center(child: DriveItemIcon(item: item, size: 96)),\n              const SizedBox(height: 24),\n              Text(\n                title,\n                key: const Key('myFilesDetailsName'),\n                textAlign: TextAlign.center,\n                style: AppTypography.detailsFileName,\n              ),\n              const SizedBox(height: 12),\n              Text(\n                metadata,\n                key: const Key('myFilesDetailsMetadata'),\n                textAlign: TextAlign.center,\n                style: AppTypography.myFilesRowMetadata,\n              ),\n            ],\n          ),\n        ),\n      ),\n    );\n  }\n}"""
          if old_action not in s:
            raise RuntimeError('missing _SheetAction block')
          s = s.replace(old_action, new_action, 1)
          p.write_text(s)

          t = Path('test/my_files_screen_test.dart')
          ts = t.read_text()
          marker = """  testWidgets('action sheet follows explicit operation capabilities', (\n"""
          test = """  testWidgets('Details action opens My Files details screen', (tester) async {\n    final pdf = mockDriveItems.singleWhere(\n      (item) => item.id == 'quarterly-report',\n    );\n    await pumpMyFiles(tester, items: <DriveItem>[pdf]);\n\n    await tester.tap(find.byKey(const Key('myFilesMore-quarterly-report')));\n    await tester.pumpAndSettle();\n    await tester.tap(find.text('Details'));\n    await tester.pumpAndSettle();\n\n    expect(find.byKey(const Key('myFilesActionSheet')), findsNothing);\n    expect(find.byKey(const Key('myFilesDetailsScreen')), findsOneWidget);\n    expect(find.byKey(const Key('myFilesDetailsName')), findsOneWidget);\n    expect(find.text('Quarterly report.pdf'), findsWidgets);\n    expect(tester.takeException(), isNull);\n  });\n\n"""
          if marker not in ts:
            raise RuntimeError('test insertion marker missing')
          ts = ts.replace(marker, test + marker, 1)
          t.write_text(ts)
          PY

      - name: Validate
        run: |
          flutter pub get
          dart format lib/features/my_files/presentation/my_files_screen.dart test/my_files_screen_test.dart
          flutter test test/my_files_screen_test.dart
          flutter test
          flutter analyze
          flutter build apk --debug
          git checkout -- pubspec.lock

      - name: Commit validated fix
        run: |
          rm .github/workflows/restore-my-files-details.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore My Files Details navigation"
          git push
