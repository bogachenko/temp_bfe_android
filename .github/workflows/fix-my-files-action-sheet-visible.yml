name: Fix visible My Files action sheet

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-my-files-action-sheet-visible.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable

      - name: Patch OneDrive action sheet visuals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/features/my_files/presentation/my_files_screen.dart')
          s = p.read_text()

          # Screenshot-confirmed OneDrive sheet surface is white.
          s = s.replace(
              '      backgroundColor: AppColors.neutralBackground2,\n      barrierColor: AppColors.dialogScrim,\n      elevation: 7,',
              '      backgroundColor: AppColors.neutralBackground1,\n      barrierColor: AppColors.dialogScrim,\n      elevation: 7,',
              1,
          )

          replacement = r'''  Widget _buildTopAction(_SheetAction action) {
    return Padding(
      padding: const EdgeInsets.symmetric(horizontal: 4),
      child: Material(
        color: AppColors.neutralBackground2,
        borderRadius: BorderRadius.circular(12),
        clipBehavior: Clip.antiAlias,
        child: InkWell(
          onTap: () => Navigator.of(context).pop(),
          child: SizedBox.expand(
            child: Column(
              children: [
                Expanded(
                  flex: 3,
                  child: Padding(
                    padding: const EdgeInsets.only(bottom: 2),
                    child: Align(
                      alignment: Alignment.bottomCenter,
                      child: Icon(
                        action.icon,
                        size: _actionIconSize,
                        color: AppColors.neutralForeground1,
                      ),
                    ),
                  ),
                ),
                Expanded(
                  flex: 2,
                  child: Padding(
                    padding: const EdgeInsets.only(top: 2),
                    child: Align(
                      alignment: Alignment.topCenter,
                      child: Text(
                        action.label,
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                        textAlign: TextAlign.center,
                        style: AppTypography.myFilesRowMetadata.copyWith(
                          color: AppColors.neutralForeground1,
                        ),
                      ),
                    ),
                  ),
                ),
              ],
            ),
          ),
        ),
      ),
    );
  }

  Widget _buildOfflineAction'''

          pattern = r"  Widget _buildTopAction\(_SheetAction action\) \{.*?\n  \}\n\n  Widget _buildOfflineAction"
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError(f'expected exactly one _buildTopAction block, got {n}')
          p.write_text(s2)
          PY

      - name: Validate
        run: |
          flutter pub get
          dart format lib/features/my_files/presentation/my_files_screen.dart
          flutter test test/my_files_screen_test.dart
          flutter test
          flutter analyze
          flutter build apk --debug
          git checkout -- pubspec.lock

      - name: Commit validated patch
        run: |
          rm .github/workflows/fix-my-files-action-sheet-visible.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Match visible My Files action sheet to OneDrive"
          git push
