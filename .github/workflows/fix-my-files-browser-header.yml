name: Fix My Files browser header contract

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-my-files-browser-header.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - name: Apply patch
        run: python3 .github/tmp_fix_browser_header.py
      - name: Validate
        run: |
          flutter pub get
          dart format lib/features/my_files/presentation/my_files_screen.dart test/my_files_screen_test.dart
          flutter test test/my_files_screen_test.dart
          flutter test
          flutter analyze
          flutter build apk --debug
          git checkout -- pubspec.lock
      - name: Commit validated fix
        run: |
          rm .github/workflows/fix-my-files-browser-header.yml
          rm .github/tmp_fix_browser_header.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Match My Files browser header to OneDrive"
          git push
