name: Fix My Files Action Sheet production hierarchy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-action-sheet-production-hierarchy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable

      - name: Apply source-backed Action Sheet corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/features/my_files/presentation/my_files_screen.dart')
          s = p.read_text()

          old = """      isScrollControlled: true,\n      backgroundColor: AppColors.neutralBackground1,"""
          new = """      isScrollControlled: true,\n      showDragHandle: false,\n      backgroundColor: AppColors.neutralBackground1,"""
          if old not in s:
              raise RuntimeError('showModalBottomSheet anchor not found')
          s = s.replace(old, new, 1)

          old = """              child: Container(\n                width: _handleWidth,\n                height: _handleHeight,"""
          new = """              child: Container(\n                key: const Key('myFilesActionSheetHandle'),\n                width: _handleWidth,\n                height: _handleHeight,"""
          if old not in s:
              raise RuntimeError('handle anchor not found')
          s = s.replace(old, new, 1)

          old = """            SizedBox(\n              height: _previewSize,\n              child: Center(\n                child: DriveItemIcon(item: widget.item, size: _previewSize),\n              ),\n            ),"""
          new = """            SizedBox(\n              key: const Key('myFilesActionSheetPreview'),\n              height: _previewSize,\n              child: Center(\n                child: widget.item.isFolder\n                    ? SizedBox(\n                        width: 84,\n                        height: 72,\n                        child: FittedBox(\n                          fit: BoxFit.contain,\n                          child: DriveItemIcon(item: widget.item, size: 84),\n                        ),\n                      )\n                    : DriveItemIcon(item: widget.item, size: _previewSize),\n              ),\n            ),"""
          if old not in s:
              raise RuntimeError('preview anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

          t = Path('test/my_files_screen_test.dart')
          ts = t.read_text()
          marker = """    expect(find.byKey(const Key('myFilesActionSheet')), findsOneWidget);\n"""
          insert = """    expect(find.byKey(const Key('myFilesActionSheet')), findsOneWidget);\n    expect(find.byKey(const Key('myFilesActionSheetHandle')), findsOneWidget);\n    expect(\n      tester.getSize(find.byKey(const Key('myFilesActionSheetHandle'))),\n      const Size(36, 4),\n    );\n    expect(\n      tester.getSize(find.byKey(const Key('myFilesActionSheetPreview'))).height,\n      72,\n    );\n"""
          if marker not in ts:
              raise RuntimeError('test marker not found')
          ts = ts.replace(marker, insert, 1)
          t.write_text(ts)
          PY

      - name: Validate
        run: |
          flutter pub get
          dart format lib/features/my_files/presentation/my_files_screen.dart test/my_files_screen_test.dart
          flutter test test/my_files_screen_test.dart
          flutter test
          flutter analyze
          flutter build apk --debug
          git checkout -- pubspec.lock

      - name: Commit validated fix
        run: |
          rm .github/workflows/fix-action-sheet-production-hierarchy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Match My Files Action Sheet production hierarchy"
          git push
