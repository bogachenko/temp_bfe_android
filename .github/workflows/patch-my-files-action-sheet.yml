name: Patch My Files action sheet

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-my-files-action-sheet.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply production OneDrive secondary-row contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/features/my_files/presentation/my_files_screen.dart")
          text = path.read_text()

          old_constant = "  static const double _bottomActionHeight = 48;\n"
          assert text.count(old_constant) == 1
          text = text.replace(old_constant, "")

          old_offline = '''  Widget _buildOfflineAction(String label) {
            return SizedBox(
              key: const Key('myFilesActionSheetOffline'),
              height: _bottomActionHeight,
              child: InkWell(
                onTap: () => setState(() => _availableOffline = !_availableOffline),
                child: Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 16),
                  child: Row(
                    children: [
                      const Icon(
                        Icons.cloud_download_outlined,
                        size: _actionIconSize,
                        color: AppColors.neutralForeground1,
                      ),
                      const SizedBox(width: 16),
                      Expanded(
                        child: Text(label, style: AppTypography.myFilesPopupItem),
                      ),
                      Switch(
                        value: _availableOffline,
                        onChanged: (value) => setState(() => _availableOffline = value),
                      ),
                    ],
                  ),
                ),
              ),
            );
          }
          '''
          new_offline = '''  Widget _buildOfflineAction(String label) {
            return InkWell(
              key: const Key('myFilesActionSheetOffline'),
              onTap: () => setState(() => _availableOffline = !_availableOffline),
              child: Padding(
                padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 12),
                child: Row(
                  children: [
                    const Icon(
                      Icons.cloud_download_outlined,
                      size: _actionIconSize,
                      color: AppColors.neutralForeground1,
                    ),
                    const SizedBox(width: 16),
                    Expanded(
                      child: Text(
                        label,
                        maxLines: 3,
                        overflow: TextOverflow.ellipsis,
                        style: AppTypography.myFilesPopupItem.copyWith(fontSize: 16),
                      ),
                    ),
                    Switch(
                      value: _availableOffline,
                      onChanged: (value) => setState(() => _availableOffline = value),
                    ),
                  ],
                ),
              ),
            );
          }
          '''
          assert text.count(old_offline) == 1
          text = text.replace(old_offline, new_offline)

          old_bottom = '''  Widget _buildBottomAction(_SheetAction action) {
            return SizedBox(
              height: _bottomActionHeight,
              child: InkWell(
                onTap: () => Navigator.of(context).pop(),
                child: Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 16),
                  child: Row(
                    children: [
                      Icon(
                        action.icon,
                        size: _actionIconSize,
                        color: AppColors.neutralForeground1,
                      ),
                      const SizedBox(width: 16),
                      Expanded(
                        child: Text(
                          action.label,
                          style: AppTypography.myFilesPopupItem,
                        ),
                      ),
                    ],
                  ),
                ),
              ),
            );
          }
          '''
          new_bottom = '''  Widget _buildBottomAction(_SheetAction action) {
            return InkWell(
              onTap: () => Navigator.of(context).pop(),
              child: Padding(
                padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 12),
                child: Row(
                  children: [
                    Icon(
                      action.icon,
                      size: _actionIconSize,
                      color: AppColors.neutralForeground1,
                    ),
                    const SizedBox(width: 16),
                    Expanded(
                      child: Text(
                        action.label,
                        maxLines: 3,
                        overflow: TextOverflow.ellipsis,
                        style: AppTypography.myFilesPopupItem.copyWith(fontSize: 16),
                      ),
                    ),
                  ],
                ),
              ),
            );
          }
          '''
          assert text.count(old_bottom) == 1
          text = text.replace(old_bottom, new_bottom)

          path.write_text(text)
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/patch-my-files-action-sheet.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Match OneDrive secondary action rows"
          git push
