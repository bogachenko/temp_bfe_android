name: Fix My Files sort menu contract

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-my-files-sort-menu.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable

      - name: Apply production sort-menu contract
        run: |
          python3 .github/tmp_fix_sort.py
          sed -i 's/A–Z/A to Z/g; s/Z–A/Z to A/g' test/my_files_screen_test.dart

      - name: Validate
        run: |
          flutter pub get
          dart format lib/features/my_files/presentation/my_files_screen.dart test/my_files_screen_test.dart
          flutter test test/my_files_screen_test.dart
          flutter test
          flutter analyze
          flutter build apk --debug
          git checkout -- pubspec.lock

      - name: Commit validated fix
        run: |
          rm .github/workflows/fix-my-files-sort-menu.yml
          rm .github/tmp_fix_sort.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Match My Files sort menu to OneDrive"
          git push
